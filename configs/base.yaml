experiment:
  name: continuous_field_diffusion
  out_dir: outputs/default
  seed: 42

data:
  root: data
  dataset: ffhq   # ffhq | celebahq | mixed
  image_size: 128
  train_split: 0.98
  num_workers: 4
  cache_index: true

model:
  time_embed_dim: 128
  global_latent_dim: 256
  coord_hidden_dim: 256
  coord_fourier_dim: 64
  num_layers: 6
  dropout: 0.1

train:
  batch_size: 8
  max_steps: 200000
  objective_mode: full_eps_mse
  use_global_encoder: false
  lr: 2e-4
  weight_decay: 1e-4
  grad_clip: 1.0
  full_weight: 1.0
  use_amp: true
  save_every: 2000
  sample_every: 1000
  log_every: 50
  resume: null

sampling:
  num_steps: 50
  eta: 0.0
  base_resolution: [128, 128]

coordinates:
  n_points_min: 1024
  n_points_max: 8192
  irregular_prob: 0.5
  coarse_ratio: 0.4
  coarse_weight: 0.5
  consistency_weight: 0.2

inverse:
  guidance_weight: 1.0
  likelihood_weight: 1.0
  steps: 200
